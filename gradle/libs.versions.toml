[versions]
junit = "6.1.3"
mockito = "5.24.0"

[libraries]
jool = { group = "org.jooq", name = "jool", version = "0.9.16" }

junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
assertj = { group = "org.assertj", name = "assertj-core", version = "3.27.7" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
release = { id = "com.bakdata.release", version = "2.2.1" }
sonar = { id = "com.bakdata.sonar", version = "2.2.1" }
sonatype = { id = "com.bakdata.sonatype", version = "2.2.1" }
lombok = { id = "io.freefair.lombok", version = "9.8.3" }
